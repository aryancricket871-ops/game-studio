<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Game Studio</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --accent:#7c3aed; --text:#e6edf3; --muted:#8b949e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:20px 16px; border-bottom:1px solid #30363d; }
  header h1 { font-size:22px; }
  header p { color:var(--muted); font-size:13px; margin-top:4px; }
  main { flex:1; padding:16px; }
  h2 { font-size:16px; margin-bottom:12px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:var(--card); border:1px solid #30363d; border-radius:14px; padding:16px; text-align:center; }
  .card .icon { font-size:34px; }
  .card .name { margin-top:8px; font-weight:600; }
  .card .tag { font-size:11px; color:var(--muted); margin-top:4px; }
  .card.ready { border-color:var(--accent); }
  footer { padding:14px; text-align:center; font-size:12px; color:var(--muted); border-top:1px solid #30363d; }
</style>
</head>
<body>
<header>
  <h1>🎮 Game Studio</h1>
  <p>Aryan Digital Solutions</p>
</header>
<main>
  <h2>गेम टेम्पलेट चुनो</h2>
  <div class="grid" id="templates"></div>
</main>
<footer>Founder: Aryan Tiwari · Aryan Digital Solutions</footer>

<script>
const TEMPLATES = [
  { id:"runner",   icon:"🏃", name:"Endless Runner", ready:false },
  { id:"shooter",  icon:"🚀", name:"Space Shooter",  ready:false },
  { id:"platform", icon:"🍄", name:"Platformer",     ready:false },
  { id:"puzzle",   icon:"🧩", name:"Puzzle",         ready:false },
  { id:"racing",   icon:"🏎️", name:"Racing",         ready:false },
  { id:"rpg",      icon:"⚔️", name:"RPG",            ready:false },
];
const box = document.getElementById("templates");
TEMPLATES.forEach(t => {
  const d = document.createElement("div");
  d.className = "card" + (t.ready ? " ready" : "");
  d.innerHTML = `<div class="icon">${t.icon}</div>
    <div class="name">${t.name}</div>
    <div class="tag">${t.ready ? "तैयार" : "जल्द आ रहा है"}</div>`;
  d.onclick = () => { if (!t.ready) alert(t.name + " अगले स्टेप में बनेगा"); };
  box.appendChild(d);
});
</script>
</body>
</html>
