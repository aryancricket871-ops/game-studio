<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner Editor</title>
<script src="phaser.min.js"></script>
<script>window.Phaser || document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\/script>');</script>
<style>
  body { background:#0d1117; color:#e6edf3; font-family:system-ui,sans-serif; margin:0; padding:10px; }
  a { color:#a78bfa; }
  #game { display:flex; justify-content:center; margin:10px 0; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #30363d; }
  input[type=range] { width:55%; }
  input[type=text] { background:#161b22; color:#e6edf3; border:1px solid #30363d; border-radius:8px; padding:8px; width:55%; }
  button { background:#7c3aed; color:#fff; border:0; border-radius:10px; padding:12px 16px; font-size:15px; margin-top:14px; }
  .file { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:10px; margin-top:12px; }
  .file b { font-size:13px; word-break:break-all; }
  .file button { padding:6px 10px; font-size:13px; margin:0 0 0 8px; }
  textarea { width:100%; height:130px; margin-top:8px; background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:8px; font-size:11px; }
</style>
</head>
<body>
<a href="index.html">← वापस</a>
<h3>🏃 Endless Runner</h3>
<div id="game"></div>
<div id="controls"></div>

<div class="row"><span>गेम का नाम</span><input type="text" id="gname" value="My Runner"></div>
<button onclick="doExport()">📦 Export</button>
<div id="export"></div>

<script src="runner.js"></script>
<script>
const cfg = {
  speed:300, gravity:1200, jump:550, spawnMs:1400,
  bgColor:"#1e293b", groundColor:"#475569",
  playerColor:"#a78bfa", obstacleColor:"#f87171"
};
const FIELDS = [
  ["speed","स्पीड","range",150,700],
  ["gravity","ग्रैविटी","range",600,2500],
  ["jump","जंप पावर","range",300,900],
  ["spawnMs","दुश्मन का गैप (ms)","range",500,3000],
  ["bgColor","बैकग्राउंड","color"],
  ["groundColor","ज़मीन","color"],
  ["playerColor","प्लेयर","color"],
  ["obstacleColor","दुश्मन","color"]
];
let game = null;
function restart() {
  if (game) game.destroy(true);
  game = startRunner("game", cfg);
}
const box = document.getElementById("controls");
FIELDS.forEach(([key, label, type, min, max]) => {
  const r = document.createElement("div");
  r.className = "row";
  r.innerHTML = '<span>' + label + '</span><input type="' + type + '" ' +
    (type === "range" ? 'min="' + min + '" max="' + max + '"' : "") + ' value="' + cfg[key] + '">';
  r.querySelector("input").onchange = e => {
    cfg[key] = type === "range" ? Number(e.target.value) : e.target.value;
    restart();
  };
  box.appendChild(r);
});
restart();

/* ---------- EXPORT ---------- */
const WORKFLOW = `name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir -p www
          cp *.html *.js www/
          cp node_modules/phaser/dist/phaser.min.js www/
      - run: npx cap add android
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
`;

function copyText(t, btn) {
  const done = () => { btn.textContent = "✅ कॉपी हुआ"; setTimeout(() => btn.textContent = "📋 कॉपी", 1500); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(done);
  } else {
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove(); done();
  }
}

async function doExport() {
  const name = document.getElementById("gname").value.trim() || "My Game";
  let id = name.toLowerCase().replace(/[^a-z0-9]/g, "") || "game";
  if (/^[0-9]/.test(id)) id = "g" + id;
  let runnerSrc;
  try { runnerSrc = await (await fetch("runner.js")).text(); }
  catch (e) { alert("runner.js पढ़ नहीं पाया। इसे http/https लिंक या APK से खोलें।"); return; }

  const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>${name}</title>
<script src="phaser.min.js"><\/script>
<style>body{margin:0;background:${cfg.bgColor};display:flex;justify-content:center;align-items:center;height:100vh}</style>
</head><body>
<div id="game"></div>
<script src="runner.js"><\/script>
<script>startRunner("game", ${JSON.stringify(cfg)});<\/script>
</body></html>
`;
  const pkg = JSON.stringify({
    name: id, version: "1.0.0", private: true,
    dependencies: {
      "@capacitor/android": "^6.1.0", "@capacitor/cli": "^6.1.0",
      "@capacitor/core": "^6.1.0", "phaser": "3.80.1"
    }
  }, null, 2) + "\n";
  const capCfg = JSON.stringify({
    appId: "com.aryandigital." + id, appName: name, webDir: "www"
  }, null, 2) + "\n";

  const files = [
    ["index.html", html],
    ["runner.js", runnerSrc],
    ["package.json", pkg],
    ["capacitor.config.json", capCfg],
    [".github/workflows/build-apk.yml", WORKFLOW]
  ];
  const out = document.getElementById("export");
  out.innerHTML = "";
  const tip = document.createElement("p");
  tip.style.cssText = "margin-top:12px;font-size:13px;color:#8b949e";
  tip.textContent = "हर फ़ाइल का यही नाम रखकर GitHub में नई फ़ाइल बनाएँ और कोड पेस्ट करें:";
  out.appendChild(tip);
  files.forEach(([fname, code]) => {
    const d = document.createElement("div");
    d.className = "file";
    const b = document.createElement("b"); b.textContent = fname;
    const btn = document.createElement("button"); btn.textContent = "📋 कॉपी";
    btn.onclick = () => copyText(code, btn);
    const ta = document.createElement("textarea"); ta.readOnly = true; ta.value = code;
    d.appendChild(b); d.appendChild(btn); d.appendChild(ta);
    out.appendChild(d);
  });
}
</script>
</body>
  </html>
